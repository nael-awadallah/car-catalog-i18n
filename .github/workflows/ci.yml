name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Coverage report is up to date
        run: |
          npm run coverage
          git diff --exit-code docs/COVERAGE.md
