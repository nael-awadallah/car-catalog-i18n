name: Release

# Publishes to npm when a version tag is pushed (e.g. v0.1.0).
# Uses npm trusted publishing (OIDC); configure the trusted publisher for this
# repository/workflow on npmjs.com, or set an NPM_TOKEN secret as a fallback.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Publish
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
